<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - 서버 오류</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #2c2c2c;
      color: white;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      padding: 20px;
    }
    .error-content {
      text-align: center;
      max-width: 400px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: bold;
      color: #5a5a5a;
      margin: 0 0 1rem;
      line-height: 1;
    }
    .error-message {
      font-size: 1.5rem;
      color: #e0e0e0;
      margin: 0 0 0.5rem;
    }
    .error-description {
      color: #a0a0a0;
      margin: 0 0 2rem;
      line-height: 1.5;
    }
    .btn-main {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 500;
      color: white;
      background-color: #6b6b6b;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-main:hover {
      background-color: #7a7a7a;
    }
    .btn-main:active {
      background-color: #5a5a5a;
    }
  </style>
</head>
<body>
  <div class="error-content">
    <h1 class="error-code">500</h1>
    <p class="error-message">서버 오류가 발생했습니다</p>
    <p class="error-description">일시적인 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.</p>
    <a href="/" class="btn-main">메인 페이지로</a>
  </div>
</body>
</html>
