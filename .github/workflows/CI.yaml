name: checkstyle on pull requests
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '21'
      - run: chmod +x gradlew | 
          ./gradlew checkstyleMain --no-daemon