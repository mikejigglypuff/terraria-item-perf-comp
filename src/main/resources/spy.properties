# p6spy 설정 - SQL 로그에 실제 파라미터 값 출력
# modulelist에는 P6Factory 구현체만 지정 (P6SpyDriver는 JDBC 드라이버이므로 넣으면 ClassCastException 발생)
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory
driverlist=com.mysql.cj.jdbc.Driver

# Slf4J를 통한 로깅 (Spring Boot 로깅과 통합)
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# SQL과 파라미터 값을 한 줄로 출력하는 포맷
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime)|%(executionTime)ms|%(category)|%(sqlSingleLine)

# 로그 레벨
logLevel=info

# 날짜 포맷
dateformat=yyyy-MM-dd HH:mm:ss
